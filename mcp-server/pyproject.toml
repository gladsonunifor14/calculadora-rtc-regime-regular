[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rtc-mcp"
version = "0.1.0"
description = "Servidor MCP que expõe as calculadoras da Reforma Tributária do Consumo (CBS, IBS e IS) como ferramentas para agentes de IA"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "mcp>=1.9",
    "httpx>=0.27",
]

[project.optional-dependencies]
# Agente classificador fiscal (Claude via API da Anthropic)
agente = [
    "anthropic[mcp]>=2.11",
]
dev = [
    "anthropic[mcp]>=2.11",
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[project.scripts]
rtc-mcp = "rtc_mcp.server:main"
rtc-classificador = "rtc_mcp.classificador:main"
rtc-comparador = "rtc_mcp.agente_comparador:main"

[tool.hatch.build.targets.wheel]
packages = ["src/rtc_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
